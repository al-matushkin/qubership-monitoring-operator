# VMAlertmanager → Keep webhook receiver for the shop-checkout PoC.
#
# Apply after monitoring-operator (VMAlertmanager) and Keep backend are running:
#   kubectl apply -f k8s/vmalertmanager-keep-shadow.yaml
#
# The monitoring-operator owns secret vmalertmanager-config-secret but only reconciles
# labels on it; alertmanager.yaml data from this manifest persists across reconciles.
#
# Match password to your Keep API key (PoC default: any-local-key).
# In-cluster URL targets keep-backend directly (no ingress required).
---
apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/component: victoriametrics
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: monitoring-operator
type: Opaque
stringData:
  alertmanager.yaml: |-
    global:
      resolve_timeout: 5m
    route:
      group_wait: 15s
      group_interval: 30s
      repeat_interval: 5m
      receiver: keep-shadow
      group_by: ['alertname', 'namespace', 'service', 'severity']
    receivers:
    - name: webhook
    - name: keep-shadow
      webhook_configs:
      - url: http://keep-backend.keep.svc:8080/alerts/event/victoriametrics
        send_resolved: true
        http_config:
          basic_auth:
            username: api_key
            password: any-local-key
