# Optional: add keep-shadow alongside an existing VMAlertmanager default receiver.
# Merges into VMAlertmanager when selectAllByDefault is true (monitoring-operator default).
#
# Use this instead of k8s/vmalertmanager-keep-shadow.yaml when ops email/Slack routes
# already own the root receiver and Keep should receive a copy of every alert.
#
# Replace KEEP_API_KEY and adjust keep-backend URL if Keep runs in another namespace.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: keep-shadow
  namespace: monitoring
spec:
  receivers:
    - name: keep-shadow
      webhook_configs:
        - url: http://keep-backend.keep.svc:8080/alerts/event/prometheus
          send_resolved: true
          http_config:
            basic_auth:
              username: api_key
              password: any-local-key
  route:
    receiver: keep-shadow
    group_by: ['alertname', 'namespace', 'service', 'severity']
    group_wait: 15s
    group_interval: 30s
    repeat_interval: 5m
    continue: true
