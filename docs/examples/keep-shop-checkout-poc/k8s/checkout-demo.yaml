apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-demo-app
  namespace: shop
  labels:
    app: checkout-demo
    application: shop-checkout
data:
  server.py: |
    import json
    import threading
    import time
    import urllib.error
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    SERVICE = "checkout-demo"
    NAMESPACE = "shop"
    APPLICATION = "shop-checkout"
    TEAM = "payments"
    PAYMENTS_URL = "http://payments-api.shop.svc:8080/charge"

    state = {
        "mode": "normal",
        "requests_total": {"200": 0, "500": 0},
        "error_ratio": 0.0,
        "latency": 0.12,
        "backend_up": 1,
        "payment_failures": 0,
    }
    lock = threading.Lock()

    def log_event(level, event, message, **extra):
        record = {
            "level": level,
            "service": SERVICE,
            "namespace": NAMESPACE,
            "application": APPLICATION,
            "team": TEAM,
            "event": event,
            "message": message,
            **extra,
        }
        print(json.dumps(record), flush=True)

    def charge_payments(request_id):
        req = urllib.request.Request(PAYMENTS_URL, method="POST", data=b"{}")
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                resp.read()
            return True
        except Exception as exc:
            with lock:
                state["payment_failures"] += 1
            log_event(
                "ERROR",
                "payment_charge_failed",
                "checkout-demo failed to charge payments-api",
                request_id=request_id,
                downstream="payments-api",
                error=str(exc),
            )
            return False

    def traffic_loop():
        while True:
            request_id = str(uuid.uuid4())
            with lock:
                mode = state["mode"]
            if mode == "outage":
                with lock:
                    state["requests_total"]["500"] += 5
                    state["requests_total"]["200"] += 1
                    total = state["requests_total"]["200"] + state["requests_total"]["500"]
                    state["error_ratio"] = state["requests_total"]["500"] / max(total, 1)
                    state["latency"] = 4.2
                    state["backend_up"] = 0
                log_event(
                    "ERROR",
                    "checkout_outage_active",
                    "checkout-demo serving outage symptoms",
                    request_id=request_id,
                )
            else:
                payment_ok = charge_payments(request_id)
                with lock:
                    state["requests_total"]["200"] += 10 if payment_ok else 5
                    if not payment_ok:
                        state["requests_total"]["500"] += 5
                    total = state["requests_total"]["200"] + state["requests_total"]["500"]
                    state["error_ratio"] = state["requests_total"]["500"] / max(total, 1)
                    state["latency"] = 0.12 if payment_ok else 2.5
                    state["backend_up"] = 1 if payment_ok else 0
            time.sleep(1)

    class Handler(BaseHTTPRequestHandler):
        def _write(self, code, body, content_type="text/plain"):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.end_headers()
            self.wfile.write(body.encode())

        def do_GET(self):
            request_id = str(uuid.uuid4())
            if self.path == "/trigger-outage":
                with lock:
                    state["mode"] = "outage"
                log_event("ERROR", "checkout_outage_started", "checkout-demo switched to outage mode", request_id=request_id)
                self._write(200, "checkout-demo switched to outage mode\n")
                return
            if self.path == "/recover":
                with lock:
                    state["mode"] = "normal"
                log_event("INFO", "checkout_recovered", "checkout-demo recovered", request_id=request_id)
                self._write(200, "checkout-demo recovered\n")
                return
            if self.path == "/status":
                with lock:
                    body = json.dumps(state, indent=2)
                self._write(200, body + "\n", "application/json")
                return
            if self.path == "/metrics":
                with lock:
                    lines = [
                        "# HELP checkout_backend_up Whether checkout backend is healthy.",
                        "# TYPE checkout_backend_up gauge",
                        f'checkout_backend_up{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}"}} {state["backend_up"]}',
                        "# HELP checkout_error_ratio Lifetime synthetic 5xx ratio (status only; alerts use rate(checkout_requests_total[5m])).",
                        "# TYPE checkout_error_ratio gauge",
                        f'checkout_error_ratio{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}"}} {state["error_ratio"]}',
                        "# HELP checkout_p99_latency_seconds Current synthetic checkout p99 latency.",
                        "# TYPE checkout_p99_latency_seconds gauge",
                        f'checkout_p99_latency_seconds{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}"}} {state["latency"]}',
                        "# HELP checkout_requests_total Synthetic checkout request counter by HTTP code.",
                        "# TYPE checkout_requests_total counter",
                        f'checkout_requests_total{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}",code="200"}} {state["requests_total"]["200"]}',
                        f'checkout_requests_total{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}",code="500"}} {state["requests_total"]["500"]}',
                        "# HELP checkout_payment_failures_total Failed downstream payment charges.",
                        "# TYPE checkout_payment_failures_total counter",
                        f'checkout_payment_failures_total{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}"}} {state["payment_failures"]}',
                    ]
                self._write(200, "\n".join(lines) + "\n")
                return
            self._write(200, "checkout-demo: use /status, /metrics, /trigger-outage, /recover\n")

        def log_message(self, fmt, *args):
            return

    threading.Thread(target=traffic_loop, daemon=True).start()
    log_event("INFO", "checkout_started", "checkout-demo listening on :8080")
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-demo
  namespace: shop
  labels:
    app: checkout-demo
    application: shop-checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-demo
  template:
    metadata:
      labels:
        app: checkout-demo
        application: shop-checkout
        service: checkout-demo
    spec:
      containers:
        - name: checkout-demo
          image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.52.1
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: checkout-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-demo
  namespace: shop
  labels:
    app: checkout-demo
    application: shop-checkout
spec:
  selector:
    app: checkout-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
