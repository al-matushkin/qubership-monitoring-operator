apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-app
  namespace: shop
  labels:
    app: payments-api
    application: shop-checkout
data:
  server.py: |
    import json
    import threading
    import time
    import uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    SERVICE = "payments-api"
    NAMESPACE = "shop"
    APPLICATION = "shop-checkout"
    TEAM = "payments"

    state = {
        "mode": "normal",
        "charges_total": {"success": 0, "failure": 0},
        "up": 1,
    }
    lock = threading.Lock()

    def log_event(level, event, message, **extra):
        record = {
            "level": level,
            "service": SERVICE,
            "namespace": NAMESPACE,
            "application": APPLICATION,
            "team": TEAM,
            "event": event,
            "message": message,
            **extra,
        }
        print(json.dumps(record), flush=True)

    class Handler(BaseHTTPRequestHandler):
        def _write(self, code, body, content_type="text/plain"):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.end_headers()
            self.wfile.write(body.encode())

        def do_GET(self):
            request_id = str(uuid.uuid4())
            if self.path == "/trigger-outage":
                with lock:
                    state["mode"] = "outage"
                    state["up"] = 0
                log_event("ERROR", "payments_outage_started", "payments-api switched to outage mode", request_id=request_id)
                self._write(200, "payments-api switched to outage mode\n")
                return
            if self.path == "/recover":
                with lock:
                    state["mode"] = "normal"
                    state["up"] = 1
                log_event("INFO", "payments_recovered", "payments-api recovered", request_id=request_id)
                self._write(200, "payments-api recovered\n")
                return
            if self.path == "/status":
                with lock:
                    body = json.dumps(state, indent=2)
                self._write(200, body + "\n", "application/json")
                return
            if self.path == "/metrics":
                with lock:
                    lines = [
                        "# HELP payments_up Whether payments-api is accepting charges.",
                        "# TYPE payments_up gauge",
                        f'payments_up{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}"}} {state["up"]}',
                        "# HELP payments_charge_total Synthetic payment charge counter by result.",
                        "# TYPE payments_charge_total counter",
                        f'payments_charge_total{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}",result="success"}} {state["charges_total"]["success"]}',
                        f'payments_charge_total{{service="{SERVICE}",namespace="{NAMESPACE}",team="{TEAM}",application="{APPLICATION}",result="failure"}} {state["charges_total"]["failure"]}',
                    ]
                self._write(200, "\n".join(lines) + "\n")
                return
            self._write(200, "payments-api: use /charge, /status, /metrics, /trigger-outage, /recover\n")

        def do_POST(self):
            request_id = str(uuid.uuid4())
            if self.path != "/charge":
                self._write(404, "not found\n")
                return
            with lock:
                if state["mode"] == "outage":
                    state["charges_total"]["failure"] += 1
                    log_event(
                        "ERROR",
                        "charge_failed",
                        "payment charge rejected during outage",
                        request_id=request_id,
                        result="failure",
                    )
                    self._write(503, json.dumps({"status": "failed", "request_id": request_id}) + "\n", "application/json")
                    return
                state["charges_total"]["success"] += 1
                log_event(
                    "INFO",
                    "charge_succeeded",
                    "payment charge accepted",
                    request_id=request_id,
                    result="success",
                )
                self._write(200, json.dumps({"status": "ok", "request_id": request_id}) + "\n", "application/json")

        def log_message(self, fmt, *args):
            return

    log_event("INFO", "payments_started", "payments-api listening on :8080")
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: shop
  labels:
    app: payments-api
    application: shop-checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        application: shop-checkout
        service: payments-api
    spec:
      containers:
        - name: payments-api
          image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.52.1
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: payments-api-app
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: shop
  labels:
    app: payments-api
    application: shop-checkout
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 8080
      targetPort: http
