# Minimal Aurora-compatible RCA API for Keep workflow integration testing.
# Implements POST /api/incidents/create and GET /api/incidents/{id} with simulated
# async investigation. Swap aurora_api_base in Keep workflows for real Aurora later.
apiVersion: v1
kind: Namespace
metadata:
  name: aurora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-rca-stub
  namespace: aurora
data:
  server.py: |
    #!/usr/bin/env python3
    """Aurora API subset for Keep PoC — not the real Aurora stack."""
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    import time
    import uuid

    INCIDENTS = {}
    INVESTIGATE_SECONDS = 20

    def now_iso():
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

    def complete_incident(inc, metadata):
        services = (inc.get("alert_service") or "").lower()
        title = (inc.get("alert_title") or "").lower()
        if "payment" in services or "payment" in title:
            root = "payments-api outage — charge endpoint returning 503"
            summary = (
                "Simulated RCA: payments-api is the upstream failure. "
                "checkout-demo and storefront alerts are downstream symptoms. "
                "Check payments-api pods and /charge health."
            )
        else:
            root = "upstream dependency failure in shop-checkout chain"
            summary = (
                "Simulated RCA: correlated multi-service outage in shop-checkout. "
                "Review incident topology and alert start times for the earliest failing service."
            )
        inc.update(
            {
                "status": "analyzed",
                "auroraStatus": "complete",
                "summary": summary,
                "rootCause": root,
                "updatedAt": now_iso(),
            }
        )

    def maybe_advance(inc):
        if inc.get("auroraStatus") == "complete":
            return
        created = inc.get("createdAtEpoch", 0)
        if time.time() - created >= INVESTIGATE_SECONDS:
            complete_incident(inc, inc.get("metadata") or {})

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _read_json(self):
            length = int(self.headers.get("Content-Length", 0))
            if not length:
                return {}
            return json.loads(self.rfile.read(length).decode("utf-8"))

        def _json(self, code, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self._json(200, {"ok": True})
                return
            if self.path.startswith("/api/incidents/"):
                iid = self.path.rsplit("/", 1)[-1]
                inc = INCIDENTS.get(iid)
                if not inc:
                    self._json(404, {"error": "incident not found"})
                    return
                maybe_advance(inc)
                self._json(200, inc)
                return
            self._json(404, {"error": "not found"})

        def do_POST(self):
            if self.path not in ("/api/incidents/create", "/api/incidents"):
                self._json(404, {"error": "not found"})
                return
            payload = self._read_json()
            iid = f"aur-{uuid.uuid4().hex[:12]}"
            inc = {
                "id": iid,
                "source_type": payload.get("source_type", "custom"),
                "alert_title": payload.get("alert_title") or payload.get("title") or "Keep incident",
                "alert_service": payload.get("service") or payload.get("alert_service") or "unknown",
                "alert_severity": payload.get("severity", "high"),
                "environment": payload.get("environment", "shop"),
                "status": "investigating",
                "auroraStatus": "running",
                "summary": "",
                "rootCause": "",
                "metadata": payload.get("metadata") or {},
                "createdAt": now_iso(),
                "createdAtEpoch": time.time(),
                "updatedAt": now_iso(),
            }
            INCIDENTS[iid] = inc
            self._json(201, {"id": iid, "status": "investigating", "auroraStatus": "running"})

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 5080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-rca
  namespace: aurora
  labels:
    app: aurora-rca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aurora-rca
  template:
    metadata:
      labels:
        app: aurora-rca
    spec:
      containers:
        - name: stub
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 5080
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: app
          configMap:
            name: aurora-rca-stub
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-rca
  namespace: aurora
spec:
  selector:
    app: aurora-rca
  ports:
    - name: http
      port: 5080
      targetPort: http
