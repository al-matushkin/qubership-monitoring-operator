# Kind PoC overlay for the upstream Keep Helm chart (keephq/keep).
# Chart 0.1.96 defaults to app 0.52.1 — override images to pick up fixes (e.g. 0.54.0 session leak).
# Bundled PostgreSQL (fresh DB), K8s secret manager, topology processor, ingress.
#
# Prerequisite: ./deploy-keep-ingress-kind.sh (defaults to this file; override with KEEP_VALUES_FILE).
# Add to /etc/hosts: 127.0.0.1 keep.local
# Port-forward: ./port-forward-keep-ingress.sh  (default localhost:30080)
# UI: http://keep.local:30080/   API: http://keep.local:30080/v2
#
# After first install or DB reset, re-apply PoC config:
#   KEEP_API_URL=http://keep.local:30080/v2 ./keep/apply-keep-config.sh
global:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: keep.local
    backendPrefix: /v2
    websocketPrefix: /websocket
    frontendPrefix: /

database:
  enabled: true
  type: postgres
  postgres:
    image:
      repository: postgres
      tag: "15"
    env:
      - name: POSTGRES_DB
        value: keep
      - name: POSTGRES_PASSWORD
        value: keep-poc-password
    port: 5432
    config:
      maxConnections: 100
      sharedBuffers: 128MB
  pvc:
    enabled: true
    size: 5Gi
    storageClass: standard

backend:
  image:
    tag: "0.54.0"
  waitForDatabase:
    enabled: true
    port: 5432
  # Default image CMD uses --workers 4; multiple Gunicorn workers race on correlation/topology
  # and can create duplicate incidents (see README troubleshooting).
  args:
    - gunicorn
    - keep.api.api:get_app
    - --bind
    - 0.0.0.0:8080
    - --workers
    - "1"
    - -k
    - uvicorn.workers.UvicornWorker
    - -c
    - /venv/lib/python3.13/site-packages/keep/api/config.py
    - --preload
  env:
    - name: DATABASE_CONNECTION_STRING
      value: postgresql+psycopg2://postgres:keep-poc-password@keep-database:5432/keep
    - name: DATABASE_NAME
      value: keep-database
    - name: SECRET_MANAGER_TYPE
      value: k8s
    # Helm chart replaces backend.env entirely — include Pusher/Soketi defaults or
    # the API never pushes real-time events to the websocket server.
    - name: PORT
      value: "8080"
    - name: PUSHER_APP_ID
      value: "1"
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: PUSHER_APP_SECRET
      value: keepappsecret
    - name: PUSHER_HOST
      value: keep-websocket
    - name: PUSHER_PORT
      value: "6001"
    - name: PROMETHEUS_MULTIPROC_DIR
      value: /tmp/prometheus
    - name: KEEP_TOPOLOGY_PROCESSOR
      value: "true"
    - name: KEEP_TOPOLOGY_PROCESSOR_INTERVAL
      value: "10"
    - name: KEEP_TOPOLOGY_PROCESSOR_LOOK_BACK_WINDOW
      value: "15"
    - name: KEEP_API_URL
      value: "http://keep.local:30080/v2"
    - name: KEEP_PLATFORM_URL
      value: "http://keep.local:30080"
  extraVolumes:
    - name: prometheus-multiproc
      emptyDir:
        medium: Memory
  extraVolumeMounts:
    - name: prometheus-multiproc
      mountPath: /tmp/prometheus

frontend:
  image:
    tag: "0.54.0"
  env:
    # Helm chart replaces frontend.env entirely — include chart defaults or WebSocket
    # (Pusher/Soketi) never connects and the UI needs manual refresh for updates.
    - name: NEXTAUTH_SECRET
      value: secret
    - name: VERCEL
      value: "1"
    - name: ENV
      value: development
    - name: NODE_ENV
      value: development
    - name: HOSTNAME
      value: 0.0.0.0
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: FRIGADE_DISABLED
      value: "true"
    - name: ALERT_SIDEBAR_FIELDS
      value: "service,source,description,message,fingerprint,url,runbook_url,owner,escalation_tier,graylog_query,incidents,timeline,relatedServices"
