workflow:
  id: shop-checkout-aurora-rca-rule-trigger
  name: Shop checkout Aurora RCA (rule)
  description: >
    Rule incidents only (shopchk-*). On incident:created — wait until alerts_count
    >= 2 (cascade context), then POST Aurora, poll until complete, enrich RCA.
    Uses created (not updated) so topology processor ticks do not spam workflow runs.
  consts:
    aurora_api_base: "http://aurora-rca.aurora.svc:5080"
    keep_api_base: "http://keep-backend:8080"
    keep_api_auth: "Basic YXBpX2tleTphbnktbG9jYWwta2V5"
    aurora_min_alerts: "2"
    aurora_wait_poll_seconds: "5"
    aurora_wait_max_seconds: "90"
  triggers:
    - type: manual
    - type: incident
      events:
        - created
  steps:
    - name: wait-for-cascade-and-guard
      if: "'{{ incident.incident_type }}' == 'rule'"
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          imports: "json,time,urllib.request"
          code: |
            exec("""
            KEEP = 'http://keep-backend:8080'
            AUTH = 'Basic YXBpX2tleTphbnktbG9jYWwta2V5'
            incident_id = '{{ incident.id }}'
            min_alerts = int('{{ consts.aurora_min_alerts }}')
            poll_s = int('{{ consts.aurora_wait_poll_seconds }}')
            max_wait = int('{{ consts.aurora_wait_max_seconds }}')
            def _get():
                req = Request(f'{KEEP}/incidents/{incident_id}', headers={'Authorization': AUTH})
                with urlopen(req, timeout=15) as resp:
                    return json.loads(resp.read().decode())
            body = {}
            ready = False
            reason = 'timeout'
            elapsed = 0
            while elapsed <= max_wait:
                body = _get()
                enrich = body.get('enrichments') or {}
                aurora = body.get('aurora_incident_id') or enrich.get('aurora_incident_id') or ''
                if aurora and str(aurora) not in ('None', 'null'):
                    reason = 'already_triggered'
                    break
                count = int(body.get('alerts_count') or 0)
                if count >= min_alerts:
                    ready = True
                    reason = 'threshold_met'
                    break
                if elapsed >= max_wait:
                    break
                time.sleep(poll_s)
                elapsed += poll_s
            RESULT = {
                'ready': 'true' if ready else 'false',
                'reason': reason,
                'alerts_count': int(body.get('alerts_count') or 0),
            }
            """) or RESULT
    - name: trigger-aurora-rca
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.wait-for-cascade-and-guard.results.ready }}' == 'true'"
      provider:
        type: http
        with:
          method: POST
          url: "{{ consts.aurora_api_base }}/api/incidents/create"
          headers:
            Content-Type: "application/json"
          body:
            alert_title: "{{ incident.user_generated_name }}"
            severity: "high"
            service: shop-checkout
            source_type: custom
            environment: shop
            metadata:
              keep_incident_id: "{{ incident.id }}"
              keep_incident_type: rule
              keep_rule_fingerprint: "{{ incident.rule_fingerprint }}"
              alerts_count: "{{ steps.wait-for-cascade-and-guard.results.alerts_count }}"
    - name: link-aurora-incident
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.trigger-aurora-rca.results.body.id }}' != ''"
      provider:
        type: mock
        with:
          enrich_incident:
            - key: aurora_incident_id
              value: "{{ steps.trigger-aurora-rca.results.body.id }}"
            - key: aurora_rca_status
              value: investigating
            - key: aurora_url
              value: "{{ consts.aurora_api_base }}/api/incidents/{{ steps.trigger-aurora-rca.results.body.id }}"
    - name: poll-aurora-rca
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.trigger-aurora-rca.results.body.id }}' != ''"
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          imports: "json,urllib.request,time"
          code: |
            exec("""
            AURORA = 'http://aurora-rca.aurora.svc:5080'
            aurora_id = '{{ steps.trigger-aurora-rca.results.body.id }}'
            def _get():
                req = Request(f'{AURORA}/api/incidents/{aurora_id}')
                with urlopen(req, timeout=15) as resp:
                    return json.loads(resp.read().decode())
            body = {}
            for _ in range(15):
                body = _get()
                if body.get('auroraStatus') == 'complete':
                    break
                time.sleep(5)
            RESULT = {
                'aurora_id': aurora_id,
                'auroraStatus': body.get('auroraStatus', ''),
                'summary': body.get('summary', ''),
                'rootCause': body.get('rootCause', ''),
            }
            """) or RESULT
  actions:
    - name: enrich-rca-summary
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.poll-aurora-rca.results.auroraStatus }}' == 'complete'"
      provider:
        type: mock
        with:
          enrich_incident:
            - key: aurora_incident_id
              value: "{{ steps.poll-aurora-rca.results.aurora_id }}"
            - key: aurora_url
              value: "{{ consts.aurora_api_base }}/api/incidents/{{ steps.poll-aurora-rca.results.aurora_id }}"
            - key: aurora_rca_status
              value: complete
            - key: rca_summary
              value: "{{ steps.poll-aurora-rca.results.summary }}"
            - key: root_cause
              value: "{{ steps.poll-aurora-rca.results.rootCause }}"
