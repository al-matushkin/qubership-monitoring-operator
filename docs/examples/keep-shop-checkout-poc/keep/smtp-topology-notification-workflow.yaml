workflow:
  id: shop-checkout-smtp-topology-notification
  name: Shop checkout SMTP notification (topology)
  description: >
    One email per topology firing episode. Fetches topology_smtp_sent via Keep API
    (GET /incidents uses SQL join — works despite UUID hyphen mismatch in workflow if).
    Clears flag on resolve; sets flag after send. In-cluster API only (HTTP provider blocks localhost).
  consts:
    keep_ui_base: "http://keep.local:30080"
    keep_api_base: "http://keep-backend:8080"
    # PoC default key (any-local-key). Basic base64(api_key:any-local-key)
    keep_api_auth: "Basic YXBpX2tleTphbnktbG9jYWwta2V5"
  triggers:
    - type: manual
    - type: incident
      events:
        - updated
  steps:
    - name: fetch-incident-enrichment
      provider:
        type: http
        with:
          method: GET
          url: "{{ consts.keep_api_base }}/incidents/{{ incident.id }}"
          headers:
            Authorization: "{{ consts.keep_api_auth }}"
  actions:
    - name: clear-topology-notification-flag-on-resolve
      if: "'{{ incident.incident_type }}' == 'topology' and ('{{ incident.status }}' == 'IncidentStatus.RESOLVED' or '{{ incident.status }}' == 'resolved')"
      provider:
        type: http
        with:
          method: POST
          url: "{{ consts.keep_api_base }}/incidents/{{ incident.id }}/enrich"
          headers:
            Authorization: "{{ consts.keep_api_auth }}"
            Content-Type: "application/json"
          body:
            enrichments:
              topology_smtp_sent: "false"
              topology_smtp_sent_at: ""
            force: true

    - name: send-shop-checkout-topology-incident-email
      if: "'{{ incident.incident_type }}' == 'topology' and ('{{ incident.status }}' == 'IncidentStatus.FIRING' or '{{ incident.status }}' == 'firing') and ('{{ steps.fetch-incident-enrichment.results.body.topology_smtp_sent }}' == 'false' or '{{ steps.fetch-incident-enrichment.results.body.topology_smtp_sent }}' == '')"
      provider:
        type: smtp
        config: "{{ providers.smtp-poc }}"
        with:
          from_email: "keep-poc@shop-checkout.local"
          from_name: "Keep shop-checkout PoC"
          to_email:
            - "oncall@shop-checkout.local"
          subject: "[{{ incident.severity }}] {{ incident.user_generated_name }}"
          html: |
            <h2>{{ incident.user_generated_name }}</h2>
            <p><b>Topology outage started</b> — incident is firing and no notification was sent for this episode yet.</p>
            <table cellpadding="4" cellspacing="0" style="border-collapse:collapse;">
              <tr><td><b>View</b></td><td>{{ incident.incident_type }}</td></tr>
              <tr><td><b>Severity</b></td><td>{{ incident.severity }}</td></tr>
              <tr><td><b>Status</b></td><td>keep.lowercase(keep.replace('{{ incident.status }}', 'IncidentStatus.', ''))</td></tr>
              <tr><td><b>Alerts linked</b></td><td>{{ incident.alerts_count }}</td></tr>
              <tr><td><b>Services</b></td><td>keep.join({{ incident.services }}, ', ')</td></tr>
            </table>
            <p style="margin:16px 0;">
              <a href="{{ consts.keep_ui_base }}/incidents/{{ incident.id }}" style="display:inline-block;padding:10px 16px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;">Open incident in Keep</a>
            </p>
            <p style="color:#555;font-size:14px;">Further alert updates on this incident will not send more emails until it resolves.</p>

    - name: set-topology-notification-flag
      if: "'{{ incident.incident_type }}' == 'topology' and ('{{ incident.status }}' == 'IncidentStatus.FIRING' or '{{ incident.status }}' == 'firing') and ('{{ steps.fetch-incident-enrichment.results.body.topology_smtp_sent }}' == 'false' or '{{ steps.fetch-incident-enrichment.results.body.topology_smtp_sent }}' == '')"
      provider:
        type: http
        with:
          method: POST
          url: "{{ consts.keep_api_base }}/incidents/{{ incident.id }}/enrich"
          headers:
            Authorization: "{{ consts.keep_api_auth }}"
            Content-Type: "application/json"
          body:
            enrichments:
              topology_smtp_sent: "true"
              topology_smtp_sent_at: "{{ incident.alerts_count }}"
            force: true
