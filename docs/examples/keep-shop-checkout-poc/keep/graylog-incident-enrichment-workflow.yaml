workflow:
  id: shop-checkout-graylog-incident-enrichment
  name: Shop checkout Graylog incident enrichment
  description: Fetch cross-service shop-checkout logs from Graylog when an incident is created or updated.
  triggers:
    - type: incident
      events:
        - created
        - updated
  steps:
    - name: fetch-incident-logs
      provider:
        type: graylog
        config: "{{ providers.graylog-shop }}"
        with:
          events_search_parameters:
            query: 'application:"shop-checkout" AND namespace:"shop"'
            query_type: elastic
            timerange_seconds: 600
            timerange_type: relative
            page: 0
            per_page: 10
    - name: format-log-summary
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          code: '"\\n".join(["Shop-checkout incident logs (last 10m, newest first):"] + [f"{i}. {(m:=e.get(\"message\",e)).get(\"time\")} | {m.get(\"service\")} | {m.get(\"source_level\")} | {m.get(\"event\")} | pod={m.get(\"pod\")}" for i,e in enumerate({{ steps.fetch-incident-logs.results }}[:10], 1)])'
  actions:
    - name: enrich-incident-with-logs
      provider:
        type: mock
        with:
          enrich_incident:
            - key: log_summary
              value: "{{ steps.format-log-summary.results }}"
            - key: graylog_query
              value: 'application:"shop-checkout" AND namespace:"shop"'
