workflow:
  id: shop-checkout-graylog-incident-enrichment
  name: Shop checkout Graylog incident enrichment (rule)
  description: >
    Fetch cross-service shop-checkout logs from Graylog when a rule incident
    (shopchk-*) is created. Waits until alerts_count >= 2 so log_summary includes
    cascade context. Uses created (not updated) to avoid topology processor spam.
  consts:
    keep_api_base: "http://keep-backend:8080"
    keep_api_auth: "Basic YXBpX2tleTphbnktbG9jYWwta2V5"
    graylog_min_alerts: "2"
    graylog_wait_poll_seconds: "5"
    graylog_wait_max_seconds: "90"
  triggers:
    - type: manual
    - type: incident
      events:
        - created
  steps:
    - name: wait-for-cascade-and-guard
      if: "'{{ incident.incident_type }}' == 'rule'"
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          imports: "json,time,urllib.request"
          code: |
            exec("""
            KEEP = 'http://keep-backend:8080'
            AUTH = 'Basic YXBpX2tleTphbnktbG9jYWwta2V5'
            incident_id = '{{ incident.id }}'
            min_alerts = int('{{ consts.graylog_min_alerts }}')
            poll_s = int('{{ consts.graylog_wait_poll_seconds }}')
            max_wait = int('{{ consts.graylog_wait_max_seconds }}')
            def _get():
                req = Request(f'{KEEP}/incidents/{incident_id}', headers={'Authorization': AUTH})
                with urlopen(req, timeout=15) as resp:
                    return json.loads(resp.read().decode())
            body = {}
            ready = False
            reason = 'timeout'
            elapsed = 0
            while elapsed <= max_wait:
                body = _get()
                enrich = body.get('enrichments') or {}
                log_summary = body.get('log_summary') or enrich.get('log_summary') or ''
                if log_summary and str(log_summary) not in ('None', 'null', ''):
                    reason = 'already_enriched'
                    break
                count = int(body.get('alerts_count') or 0)
                if count >= min_alerts:
                    ready = True
                    reason = 'threshold_met'
                    break
                if elapsed >= max_wait:
                    break
                time.sleep(poll_s)
                elapsed += poll_s
            RESULT = {
                'ready': 'true' if ready else 'false',
                'reason': reason,
                'alerts_count': int(body.get('alerts_count') or 0),
            }
            """) or RESULT
    - name: fetch-incident-logs
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.wait-for-cascade-and-guard.results.ready }}' == 'true'"
      provider:
        type: graylog
        config: "{{ providers.graylog-shop }}"
        with:
          events_search_parameters:
            query: 'application:"shop-checkout" AND namespace:"shop"'
            query_type: elastic
            timerange_seconds: 600
            timerange_type: relative
            page: 0
            per_page: 10
    - name: format-log-summary
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.wait-for-cascade-and-guard.results.ready }}' == 'true'"
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          code: "(lambda logs: 'Shop-checkout incident logs (last 10m, newest first):' + chr(10) + chr(10).join([f\"- {i}. {(m:=e.get('message',e)).get('timestamp', m.get('time',''))} | {m.get('service', m.get('labels_service',''))} | {m.get('source_level','')} | {m.get('event','')} | pod={m.get('pod','')}\" for i,e in enumerate(logs[:10], 1)]))({{ steps.fetch-incident-logs.results }})"
  actions:
    - name: enrich-incident-with-logs
      if: "'{{ incident.incident_type }}' == 'rule' and '{{ steps.wait-for-cascade-and-guard.results.ready }}' == 'true'"
      provider:
        type: mock
        with:
          enrich_incident:
            - key: log_summary
              value: "{{ steps.format-log-summary.results }}"
            - key: graylog_query
              value: 'application:"shop-checkout" AND namespace:"shop"'
