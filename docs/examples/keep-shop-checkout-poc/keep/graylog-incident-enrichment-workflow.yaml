workflow:
  id: shop-checkout-graylog-incident-enrichment
  name: Shop checkout Graylog incident enrichment
  description: Fetch cross-service shop-checkout logs from Graylog when an incident is created or updated.
  triggers:
    - type: incident
      events:
        - created
        - updated
  steps:
    - name: fetch-incident-logs
      provider:
        type: graylog
        config: "{{ providers.graylog-shop }}"
        with:
          events_search_parameters:
            query: 'application:"shop-checkout" AND namespace:"shop"'
            query_type: elastic
            timerange_seconds: 600
            timerange_type: relative
            page: 0
            per_page: 10
  actions:
    - name: enrich-incident-with-logs
      provider:
        type: mock
        with:
          enrich_incident:
            - key: log_summary
              value: |
                Shop-checkout incident logs (last 10m, newest first):
                1. {{ steps.fetch-incident-logs.results.0.message.time }} | {{ steps.fetch-incident-logs.results.0.message.service }} | {{ steps.fetch-incident-logs.results.0.message.source_level }} | {{ steps.fetch-incident-logs.results.0.message.event }} | pod={{ steps.fetch-incident-logs.results.0.message.pod }}
                2. {{ steps.fetch-incident-logs.results.1.message.time }} | {{ steps.fetch-incident-logs.results.1.message.service }} | {{ steps.fetch-incident-logs.results.1.message.source_level }} | {{ steps.fetch-incident-logs.results.1.message.event }} | pod={{ steps.fetch-incident-logs.results.1.message.pod }}
                3. {{ steps.fetch-incident-logs.results.2.message.time }} | {{ steps.fetch-incident-logs.results.2.message.service }} | {{ steps.fetch-incident-logs.results.2.message.source_level }} | {{ steps.fetch-incident-logs.results.2.message.event }} | pod={{ steps.fetch-incident-logs.results.2.message.pod }}
                4. {{ steps.fetch-incident-logs.results.3.message.time }} | {{ steps.fetch-incident-logs.results.3.message.service }} | {{ steps.fetch-incident-logs.results.3.message.source_level }} | {{ steps.fetch-incident-logs.results.3.message.event }} | pod={{ steps.fetch-incident-logs.results.3.message.pod }}
                5. {{ steps.fetch-incident-logs.results.4.message.time }} | {{ steps.fetch-incident-logs.results.4.message.service }} | {{ steps.fetch-incident-logs.results.4.message.source_level }} | {{ steps.fetch-incident-logs.results.4.message.event }} | pod={{ steps.fetch-incident-logs.results.4.message.pod }}
                6. {{ steps.fetch-incident-logs.results.5.message.time }} | {{ steps.fetch-incident-logs.results.5.message.service }} | {{ steps.fetch-incident-logs.results.5.message.source_level }} | {{ steps.fetch-incident-logs.results.5.message.event }} | pod={{ steps.fetch-incident-logs.results.5.message.pod }}
                7. {{ steps.fetch-incident-logs.results.6.message.time }} | {{ steps.fetch-incident-logs.results.6.message.service }} | {{ steps.fetch-incident-logs.results.6.message.source_level }} | {{ steps.fetch-incident-logs.results.6.message.event }} | pod={{ steps.fetch-incident-logs.results.6.message.pod }}
                8. {{ steps.fetch-incident-logs.results.7.message.time }} | {{ steps.fetch-incident-logs.results.7.message.service }} | {{ steps.fetch-incident-logs.results.7.message.source_level }} | {{ steps.fetch-incident-logs.results.7.message.event }} | pod={{ steps.fetch-incident-logs.results.7.message.pod }}
                9. {{ steps.fetch-incident-logs.results.8.message.time }} | {{ steps.fetch-incident-logs.results.8.message.service }} | {{ steps.fetch-incident-logs.results.8.message.source_level }} | {{ steps.fetch-incident-logs.results.8.message.event }} | pod={{ steps.fetch-incident-logs.results.8.message.pod }}
                10. {{ steps.fetch-incident-logs.results.9.message.time }} | {{ steps.fetch-incident-logs.results.9.message.service }} | {{ steps.fetch-incident-logs.results.9.message.source_level }} | {{ steps.fetch-incident-logs.results.9.message.event }} | pod={{ steps.fetch-incident-logs.results.9.message.pod }}
            - key: graylog_query
              value: 'application:"shop-checkout" AND namespace:"shop"'
