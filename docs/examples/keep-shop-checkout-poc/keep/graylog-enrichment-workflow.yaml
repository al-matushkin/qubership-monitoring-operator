workflow:
  id: shop-checkout-graylog-enrichment
  name: Shop checkout Graylog enrichment
  description: Fetch related shop-checkout logs from Graylog when alerts fire.
  triggers:
    - type: alert
      filters:
        - key: namespace
          value: shop
  steps:
    - name: fetch-shop-logs
      provider:
        type: graylog
        config: "{{ providers.graylog-shop }}"
        with:
          events_search_parameters:
            query: 'application:"shop-checkout" AND service:"{{ alert.service }}" AND namespace:"{{ alert.namespace }}"'
            query_type: elastic
            timerange_seconds: 600
            timerange_type: relative
            page: 0
            per_page: 5
    - name: format-log-snippet
      provider:
        type: python
        config: "{{ providers.default-python }}"
        with:
          code: "(lambda logs: ' • '.join([f\"Related {{ alert.service }} logs in {{ alert.namespace }} (last 10m, newest first):\"] + [f\"{i}. {(m:=e.get('message',e)).get('timestamp', m.get('time',''))} | {m.get('source_level','')} | {m.get('event','')} | pod={m.get('pod','')}\" for i,e in enumerate(logs[:5], 1)]))({{ steps.fetch-shop-logs.results }})"
  actions:
    - name: enrich-with-logs
      provider:
        type: mock
        with:
          enrich_alert:
            - key: log_snippet
              value: "{{ steps.format-log-snippet.results }}"
            - key: graylog_query
              value: 'application:"shop-checkout" AND service:"{{ alert.service }}" AND namespace:"{{ alert.namespace }}"'
